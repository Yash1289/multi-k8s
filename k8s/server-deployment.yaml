apiVersion: apps/v1
kind: Deployment
metadata:
  name: server-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      containers:
        - name: server
          image: yash1289/multi-server:latest
          ports:
            - containerPort: 5000
          env:
            - name: REDIS_HOST
              value: redis-cluster-ip-service
            - name: REDIS_PORT
              value: '6379'
            - name: PGUSER
              value: postgres
            - name: PGHOST
              value: postgres-cluster-ip-service
              # All these port values needs to be string otherwise we will get an error on creation of these objects.
            - name: PGPORT
              value: '5432'
            - name: PGDATABASE
              value: postgres
            # We cannot add password of our PG DB here as it is not secure enough. For this we are putting in extra efforts.
            # name could have been anything we could have stored it against any name.
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: pgpassword
                  # key name is required because inside a single secret key name we could store multiple key value pairs 
                  # so that's why we have to define which one we want to use. 
                  key: PGPASSWORD