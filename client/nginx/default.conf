server {
    listen 3000;

    location / {
        # Here we are using root directive to specify the root directory for our frontend service, which is /usr/share/nginx/html.
        # We are also using index directive to specify the default file to serve when a request is made to the root location, which is index.html or index.htm.
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}

