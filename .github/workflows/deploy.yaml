name: Deploy MultiK8s

on:
  push:
    branches:
      - main

env:
  SHA: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - uses: actions/checkout@v7

      - name: Test
        run: |
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          docker build -t yash1289/react-test -f ./client/Dockerfile.dev ./client
          docker run -e CI=true yash1289/react-test npm test

      - name: Set Identity Provider
        uses: google-github-actions/auth@v3
        with:
          project_id: "multi-k8s-509916"
          workload_identity_provider: "projects/720883039602/locations/global/workloadIdentityPools/github/providers/my-repo"

      - name: Set Project
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: "multi-k8s-509916"

      - name: Auth
        run: |
          gcloud --quiet auth configure-docker

      - name: Get Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: multi-k8s
          location: us-central1
          project_id: "multi-k8s-509916"

      - name: Build
        run: |
          docker build -t yash1289/multi-client:latest -t yash1289/multi-client:${{ env.SHA }} -f ./client/Dockerfile ./client
          docker build -t yash1289/multi-server:latest -t yash1289/multi-server:${{ env.SHA }} -f ./server/Dockerfile ./server
          docker build -t yash1289/multi-worker:latest -t yash1289/multi-worker:${{ env.SHA }} -f ./worker/Dockerfile ./worker

      - name: Push
        run: |
          docker push yash1289/multi-client:latest
          docker push yash1289/multi-server:latest
          docker push yash1289/multi-worker:latest

          docker push yash1289/multi-client:${{ env.SHA }}
          docker push yash1289/multi-server:${{ env.SHA }}
          docker push yash1289/multi-worker:${{ env.SHA }}

      - name: Apply
        run: |
          kubectl apply -f k8s
          kubectl set image deployments/server-deployment server=yash1289/multi-server:${{ env.SHA }}
          kubectl set image deployments/client-deployment client=yash1289/multi-client:${{ env.SHA }}
          kubectl set image deployments/worker-deployment worker=yash1289/multi-worker:${{ env.SHA }}