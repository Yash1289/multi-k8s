# Here we are creating a reverse proxy for our frontend service first, our frontend is listening on port 3000 
# And our frotend service is named client in our docker-compose file, so we are using that name here.
upstream client {
    server client:3000;
}

# Similarly we are creating a reverse proxy for our backend service, our backend is listening on port 5000
# And our backend service is named api in our docker-compose file, so we are using that name here.
upstream api {
    server api:5000;
}


# We are creating a server block that listens on port 80, and we are defining three locations: /, /ws, and /api.
# The / location is for our frontend service, the /ws location is for our websocket connections, and the /api location is for our backend service.
# Inside each location block, we are using the proxy_pass directive to forward the requests to the appropriate upstream server.
# Inside the /ws location block, we are also setting some additional headers to handle websocket connections.
# Inside the api location block, we are using the rewrite directive to remove the /api prefix from the request URL before forwarding it to the backend service.
server {
    listen 80;

    location / {
        proxy_pass http://client;
    }

    location /ws {
      proxy_pass http://client;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "Upgrade";
    }

    location /api {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://api;
    }
}